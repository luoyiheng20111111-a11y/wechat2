# ============================================================
# 备注：这是【Swift / iOS 端】打包流程（Xcode 构建 unsigned IPA）
#
# 与 Android 完全分开：
#   - Android APK 打包见 .github/workflows/android.yml
#   - 本文件只负责 MyApp_GitHub/ 下的 Swift 源码
#   - 只有 Swift 代码变动才触发，避免和 Android 打包互相干扰
#
# 产物：Artifacts 里的 WeChat-unsigned-IPA
# ============================================================
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MyApp_GitHub/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        working-directory: MyApp_GitHub
        run: |
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: MyApp_GitHub
        run: |
          rm -rf Payload WeChat-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MyApp.app Payload/WeChat.app
          ditto -c -k --sequesterRsrc --keepParent Payload WeChat-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChat-unsigned-IPA
          path: MyApp_GitHub/WeChat-unsigned.ipa
