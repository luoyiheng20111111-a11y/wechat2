# ============================================================
# 工具工作流：导出当前签名 keystore（从 actions 缓存恢复）
# 用途：把它写入 GitHub Secret（RELEASE_KEYSTORE_B64），
#      固定 APK 签名，保证以后每次构建的包都能覆盖安装
#      （签名变化会导致系统拒绝覆盖安装，聊天记录被迫丢失）。
# 只手动触发，不参与日常打包，不触发 Android CI。
# ============================================================
name: Export Release Keystore

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore release keystore from cache (restore only)
        uses: actions/cache/restore@v4
        with:
          path: android/keystore/release.jks
          key: android-release-keystore-v1

      - name: Check keystore
        run: |
          if [ ! -f android/keystore/release.jks ]; then
            echo "ERROR: keystore not found in cache (key: android-release-keystore-v1)"
            echo "缓存已被清理，无法导出原签名；需要与用户确认后再生成新签名。"
            exit 1
          fi
          echo "keystore-sha256=$(sha256sum android/keystore/release.jks | cut -d' ' -f1)"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: android/keystore/release.jks
          if-no-files-found: error
          retention-days: 7
